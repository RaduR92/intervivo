<app-auth-layout>
  <h1 class="font-serif text-3xl font-bold text-slate-900">
    Forgot Password
  </h1>
  <p class="mt-2 text-sm text-slate-500">
    Enter your email and we'll send you a link to reset your password
  </p>

  @if (submitted()) {
    <div
      class="mt-8 rounded-border border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-700"
    >
      If an account exists for {{ email() }}, a reset link is on its way.
    </div>
  } @else {
    <form class="mt-8 flex flex-col gap-4" (ngSubmit)="submit()">
      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm text-slate-900">Email</label>
        <div class="relative">
          <i
            class="pi pi-envelope pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-500"
          ></i>
          <input
            id="email"
            name="email"
            type="email"
            pInputText
            class="w-full"
            style="padding-left: 2.75rem"
            placeholder="alexander@systems.internal"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
          />
        </div>
      </div>

      <p-button
        type="submit"
        label="Send Reset Link"
        icon="pi pi-arrow-right"
        iconPos="right"
        severity="contrast"
        [fluid]="true"
        styleClass="mt-2"
      />
    </form>
  }

  <p class="mt-6 text-center text-sm text-slate-500">
    <a routerLink="/auth/login" class="text-slate-900 hover:text-emerald-600"
      >Back to Sign In</a
    >
  </p>
</app-auth-layout>
