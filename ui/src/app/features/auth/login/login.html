<app-auth-layout>
  <h1 class="font-serif text-3xl font-bold text-slate-900">Sign In</h1>
  <p class="mt-2 text-sm text-slate-500">
    Enter your credentials to access your interview workspace
  </p>

  @if (errorMessage()) {
    <div
      class="mt-4 rounded-border border border-red-200 bg-red-50 p-3 text-sm text-red-700"
    >
      {{ errorMessage() }}
    </div>
  }

  <form class="mt-8 flex flex-col gap-4" (ngSubmit)="submit()">
    <div class="flex flex-col gap-1">
      <label for="email" class="text-sm text-slate-900">Email</label>
      <div class="relative">
        <i
          class="pi pi-envelope pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-500"
        ></i>
        <input
          id="email"
          name="email"
          type="email"
          pInputText
          class="w-full"
          style="padding-left: 2.75rem"
          placeholder="alexander@systems.internal"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
        />
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <div class="flex items-center justify-between">
        <label for="password" class="text-sm text-slate-900">Password</label>
        <a
          routerLink="/auth/forgot-password"
          class="text-xs text-slate-500 hover:text-slate-900"
          >Forgot password?</a
        >
      </div>
      <div class="relative">
        <i
          class="pi pi-lock pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-500"
        ></i>
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          pInputText
          class="w-full"
          style="padding-left: 2.75rem; padding-right: 2.75rem"
          placeholder="••••••••••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        <button
          type="button"
          class="absolute top-1/2 right-3 -translate-y-1/2 text-slate-500"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </button>
      </div>
    </div>

    <p-button
      type="submit"
      label="Sign In"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="contrast"
      [fluid]="true"
      [loading]="loading()"
      [disabled]="loading() || !canSubmit()"
      styleClass="mt-2"
    />
  </form>
</app-auth-layout>
