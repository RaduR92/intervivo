<div class="flex flex-col gap-6">
  <div class="flex items-center gap-3">
    <p-button
      icon="pi pi-arrow-left"
      severity="secondary"
      text
      rounded
      (onClick)="back()"
      ariaLabel="Back to candidates"
    />
    <h1 class="text-2xl font-semibold text-color">Candidate</h1>
  </div>

  <div class="flex max-w-md flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label for="candidate-name" class="text-sm text-muted-color">Name</label>
      <input
        id="candidate-name"
        type="text"
        pInputText
        class="w-full"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="candidate-email" class="text-sm text-muted-color"
        >Email</label
      >
      <input
        id="candidate-email"
        type="email"
        pInputText
        class="w-full"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="candidate-position" class="text-sm text-muted-color"
        >Position</label
      >
      <input
        id="candidate-position"
        type="text"
        pInputText
        class="w-full"
        [ngModel]="position()"
        (ngModelChange)="position.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="candidate-status" class="text-sm text-muted-color"
        >Status</label
      >
      <input
        id="candidate-status"
        type="text"
        pInputText
        class="w-full"
        [ngModel]="status()"
        (ngModelChange)="status.set($event)"
      />
    </div>

    <div class="flex gap-2 pt-2">
      <p-button label="Save" (onClick)="save()" />
      <p-button label="Cancel" severity="secondary" text (onClick)="back()" />
    </div>
  </div>

  <div class="flex flex-col gap-3">
    <h2 class="text-lg font-semibold text-color">Interview History</h2>
    <div class="overflow-x-auto">
      <p-table [value]="interviewHistory()" dataKey="id">
        <ng-template pTemplate="header">
          <tr>
            <th>Position</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-interview>
          <tr>
            <td>{{ interview.position }}</td>
            <td>{{ interview.date }}</td>
            <td>{{ interview.status }}</td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="py-6 text-center text-muted-color">
              No interview history yet.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
