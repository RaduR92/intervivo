<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-2xl font-semibold text-color">Candidates</h1>
    <p-button
      label="Add Candidate"
      icon="pi pi-plus"
      (onClick)="openAddDialog()"
    />
  </div>

  <div class="overflow-x-auto">
    <p-table
      [value]="candidates()"
      dataKey="id"
      [paginator]="true"
      [rows]="10"
      [rowHover]="true"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Position</th>
          <th>Status</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-candidate>
        <tr class="cursor-pointer" (click)="openDetail(candidate.id)">
          <td>{{ candidate.name }}</td>
          <td>{{ candidate.email }}</td>
          <td>{{ candidate.position }}</td>
          <td>{{ candidate.status }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4" class="py-6 text-center text-muted-color">
            No candidates yet.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<router-outlet />
