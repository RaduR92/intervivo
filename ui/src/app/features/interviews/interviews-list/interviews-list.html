<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold text-color">Interviews</h1>
    <p-button
      label="Add Interview"
      icon="pi pi-plus"
      (onClick)="openAddDialog()"
    />
  </div>

  <p-table
    [value]="interviews()"
    dataKey="id"
    [paginator]="true"
    [rows]="10"
    [rowHover]="true"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Candidate</th>
        <th>Position</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-interview>
      <tr class="cursor-pointer" (click)="openDetail(interview.id)">
        <td>{{ interview.candidate }}</td>
        <td>{{ interview.position }}</td>
        <td>{{ interview.date }}</td>
        <td>{{ interview.status }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="py-6 text-center text-muted-color">
          No interviews yet.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<router-outlet />
