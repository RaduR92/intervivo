<div class="flex flex-col gap-4">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-2xl font-semibold text-color">Interviews</h1>
    <p-button label="Add Interview" icon="pi pi-plus" (onClick)="openAddDialog()" />
  </div>

  <div class="flex flex-col gap-3 lg:flex-row lg:items-center">
    <div class="relative flex-1">
      <i
        class="pi pi-search pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted-color"
      ></i>
      <input
        type="text"
        pInputText
        class="w-full"
        style="padding-left: 2.5rem"
        placeholder="Search sessions..."
        [ngModel]="search()"
        (ngModelChange)="onSearchInput($event)"
        name="search"
      />
    </div>
    <div class="flex flex-col gap-3 sm:flex-row">
      <p-select
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="status()"
        (ngModelChange)="onStatusChange($event)"
        name="statusFilter"
        styleClass="w-full sm:w-48"
      />
      <p-select
        [options]="typeOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="type()"
        (ngModelChange)="onTypeChange($event)"
        name="typeFilter"
        styleClass="w-full sm:w-48"
      />
    </div>
    <p class="shrink-0 text-sm text-muted-color sm:text-right">
      {{ interviews().length }} session{{ interviews().length === 1 ? '' : 's' }}
    </p>
  </div>

  <app-interview-sessions-table
    [sessions]="interviews()"
    perspective="hr"
    [paginated]="true"
    emptyMessage="No interviews match your filters."
    (rowClick)="openDetail($event)"
  />
</div>

<router-outlet />
