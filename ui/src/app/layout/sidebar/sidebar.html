<aside
  class="flex flex-col border-r border-surface-200 bg-surface-0 transition-all duration-200"
  [class.w-64]="!layout.sidebarCollapsed()"
  [class.w-16]="layout.sidebarCollapsed()"
>
  <div class="flex justify-end p-2">
    <p-button
      [icon]="layout.sidebarCollapsed() ? 'pi pi-angle-right' : 'pi pi-angle-left'"
      severity="secondary"
      text
      rounded
      size="small"
      (onClick)="layout.toggleSidebar()"
      ariaLabel="Toggle sidebar"
    />
  </div>

  <nav class="flex flex-col gap-1 px-2">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-highlight text-color-emphasis"
        class="flex items-center gap-3 rounded-border px-3 py-2 text-sm text-color hover:bg-emphasis"
        [class.justify-center]="layout.sidebarCollapsed()"
        [title]="layout.sidebarCollapsed() ? item.label : ''"
      >
        <i [class]="item.icon + ' text-base'"></i>
        @if (!layout.sidebarCollapsed()) {
          <span>{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>
