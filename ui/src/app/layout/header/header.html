<header
  class="flex h-16 shrink-0 items-center justify-between gap-3 border-b border-surface bg-[var(--p-content-background)] px-4"
>
  <div class="flex items-center gap-3">
    <p-button
      icon="pi pi-bars"
      severity="secondary"
      text
      rounded
      class="md:hidden"
      (onClick)="layout.toggleMobileMenu()"
      ariaLabel="Toggle menu"
    />
    <span class="text-lg font-semibold text-color">Intervivo</span>
  </div>
  <div class="flex items-center gap-1">
    <p-button
      [icon]="theme.dark() ? 'pi pi-sun' : 'pi pi-moon'"
      severity="secondary"
      text
      rounded
      (onClick)="theme.toggle()"
      [ariaLabel]="
        theme.dark() ? 'Switch to light mode' : 'Switch to dark mode'
      "
    />
    @if (auth.currentUser(); as user) {
      @if (user.firstName && user.lastName) {
        @let userInitials = initials(user.firstName, user.lastName);
        <div class="ml-1 flex items-center gap-2 pr-1">
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold text-white"
            [class]="avatarColorClass(userInitials)"
          >
            {{ userInitials }}
          </span>
          <div class="hidden sm:block">
            <p class="text-sm leading-tight text-color">{{ user.firstName }} {{ user.lastName }}</p>
            <p class="text-xs leading-tight font-medium tracking-wide text-muted-color uppercase">
              {{ user.role }}
            </p>
          </div>
        </div>
      }
    }
    <p-button
      icon="pi pi-sign-out"
      severity="secondary"
      text
      rounded
      (onClick)="logout()"
      ariaLabel="Log out"
    />
  </div>
</header>
