<header
  class="flex h-16 shrink-0 items-center justify-between gap-3 border-b border-surface bg-[var(--p-content-background)] px-4"
>
  <div class="flex items-center gap-3">
    <p-button
      icon="pi pi-bars"
      severity="secondary"
      text
      rounded
      class="md:hidden"
      (onClick)="layout.toggleMobileMenu()"
      ariaLabel="Toggle menu"
    />
    <span class="text-lg font-semibold text-color">Intervivo</span>
  </div>
  <p-button
    [icon]="theme.dark() ? 'pi pi-sun' : 'pi pi-moon'"
    severity="secondary"
    text
    rounded
    (onClick)="theme.toggle()"
    [ariaLabel]="theme.dark() ? 'Switch to light mode' : 'Switch to dark mode'"
  />
</header>
