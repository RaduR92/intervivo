name: Deploy

on:
  push:
    branches: [main]

# Ensures an older run in flight (e.g. from a rapid follow-up push) can never
# finish its deploy step after a newer one — the newer push cancels it.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: api
      # nest build / vitest / oxlint all resolve @generated/prisma/* imports,
      # which only exist after this runs — there is no postinstall hook for it.
      - run: npx prisma generate
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm run test
        working-directory: api
      - run: npm run build
        working-directory: api

  check-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm run test
        working-directory: ui
      - run: npm run build
        working-directory: ui

  build-api:
    needs: check-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # build-push-action's cache-to/from: type=gha requires the buildx
      # driver — the default `docker` driver on GitHub-hosted runners doesn't
      # support GHA cache export and fails the build.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/intervivo-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-
      # No cache-from/cache-to: type=gha here. This Dockerfile mixes prisma
      # generate + tsc's own incremental build state inside the same layer,
      # and a stale/reused GHA cache layer has twice produced a runner image
      # with a corrupted import (dist/generated/prisma/client.js importing a
      # ".ts" path instead of ".js") that crash-loops in production — even
      # after the underlying source fix (untracking tsconfig.build.tsbuildinfo)
      # was committed and this exact stage's inputs hadn't changed. A fully
      # uncached build is the only way we've reliably reproduced a correct
      # image; the extra build time is worth it until this is root-caused.
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          no-cache: true

  build-ui:
    needs: check-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/intervivo-ui
          tags: |
            type=ref,event=branch
            type=sha,prefix=${{ github.ref_name }}-
      - uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            API_URL=https://api-intervivo.rr-dev.ro/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-api, build-ui]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # Keeps /opt/intervivo/docker-compose.prod.yml on the VPS in sync with
      # this repo, so compose changes don't rely on a manual copy step.
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: docker-compose.prod.yml
          target: /opt/intervivo
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/intervivo
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -p intervivo -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -p intervivo -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker compose -p intervivo -f docker-compose.prod.yml --env-file .env.prod exec -T api npx prisma migrate deploy
            docker compose -p intervivo -f docker-compose.prod.yml --env-file .env.prod exec -T api npx prisma db seed
            docker image prune -f
