services:
  postgres:
    image: postgres:18-alpine
    container_name: intervivo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intervivo
      POSTGRES_PASSWORD: intervivo
      POSTGRES_DB: intervivo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intervivo -d intervivo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: intervivo-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
